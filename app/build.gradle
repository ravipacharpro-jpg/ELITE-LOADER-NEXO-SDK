plugins {
    id 'com.android.application'
    id 'org.lsposed.lsparanoid'
}

// Firebase configuration is supplied at app/google-services.json.
// Fail the build if it is missing instead of shipping an unconfigured Google button.
apply plugin: 'com.google.gms.google-services'

apply from: '../signing.gradle'

android {
    namespace "com.pubgm"
    compileSdk rootProject.ext.compileSdk
    buildToolsVersion rootProject.ext.buildTools
    
    lint {
       abortOnError false
       checkReleaseBuilds false
    }
    
    defaultConfig {
        applicationId "elite.com"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            defaultConfig.applicationId = "elite.com"
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // BlackBox reflection annotations must remain intact in debug builds.
            shrinkResources false
            minifyEnabled false
            defaultConfig.applicationId = "elite.com"
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    packagingOptions {
        resources {
            excludes += "/META-INF/AL2.0"
            excludes += "/META-INF/LGPL2.1"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += "/META-INF/LICENSE"
            excludes += "/META-INF/LICENSE.txt"
            excludes += "/META-INF/license.txt"
            excludes += "/META-INF/NOTICE"
            excludes += "/META-INF/NOTICE.txt"
            excludes += "/META-INF/notice.txt"
            excludes += "/META-INF/ASL2.0"
            excludes += "/META-INF/*.kotlin_module"
            excludes += "/META-INF/gradle/incremental.annotation.processors"
        }
    }
        
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    
    ndkVersion rootProject.ext.ndkVersion
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    // NEXO open-source BlackBox SDK; uses prebuilt Bcore-release.aar
    implementation files('libs/Bcore-release.aar')

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    // Official Google Sign in with Google button via Android Credential Manager.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Google account -> Firebase Authentication (no fake credentials/tokens).
    // The Firebase console and google-services.json must match applicationId elite.com.
    implementation platform('com.google.firebase:firebase-bom:35.0.2')
    implementation 'com.google.firebase:firebase-auth'
    // Firebase heartbeat SDK accesses the preferences DataStore runtime.
    // Explicit dependency prevents PreferenceDataStoreDelegateKt class loading failure.
    implementation 'androidx.datastore:datastore-preferences:1.1.2'

    implementation 'net.lingala.zip4j:zip4j:2.9.0'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    
    implementation("com.github.tiann:FreeReflection:3.2.2") {
        exclude group: 'me.weishu.reflection'
    }

    // BlackBoxCore Dependencies
    // Reflection processor is now compiled locally by :Bcore -> :compiler.
    implementation "com.squareup:javapoet:1.13.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}